apiVersion: v1
kind: ServiceAccount
metadata:
  name: hivebox-agent
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hivebox-agent
  namespace: default
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hivebox-agent
  namespace: default
subjects:
  - kind: ServiceAccount
    name: hivebox-agent
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hivebox-agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hivebox-agent
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hivebox-agent
  template:
    metadata:
      labels:
        app: hivebox-agent
    spec:
      serviceAccountName: hivebox-agent
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: grafana/agent:v0.44.3
          env:
            - name: AGENT_MODE
              value: flow
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/agent
            - /etc/agent/config.river
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 12345
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/agent
              readOnly: true
            - name: data
              mountPath: /var/lib/agent
      volumes:
        - name: config
          configMap:
            name: hivebox-agent
        - name: data
          emptyDir: {}
