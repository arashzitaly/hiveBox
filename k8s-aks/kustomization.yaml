apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../k8s
images:
  - name: hivebox
    newName: ghcr.io/arashzitaly/hivebox
    newTag: phase5-local
  - name: hivebox-minio
    newName: ghcr.io/arashzitaly/hivebox-minio
    newTag: phase5-local
patches:
  - target:
      kind: Deployment
      name: hivebox-minio
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-pull
  - target:
      kind: Job
      name: hivebox-minio-bucket
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-pull
