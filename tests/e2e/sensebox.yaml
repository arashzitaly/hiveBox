apiVersion: v1
kind: ConfigMap
metadata:
  name: sensebox-fixture
data:
  server.py: |
    from datetime import datetime, timezone
    from flask import Flask, jsonify

    app = Flask(__name__)
    temperatures = {"fixture-1": "18", "fixture-2": "22", "fixture-3": "26"}

    @app.get("/healthz")
    def health():
        return "", 200

    @app.get("/boxes/<box_id>")
    def get_box(box_id):
        if box_id not in temperatures:
            return "", 404
        return jsonify(sensors=[{
            "title": "Temperatur",
            "lastMeasurement": {
                "value": temperatures[box_id],
                "createdAt": datetime.now(timezone.utc).isoformat(),
            },
        }])

    app.run(host="0.0.0.0", port=8080)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensebox-fixture
spec:
  selector:
    matchLabels:
      app: sensebox-fixture
  template:
    metadata:
      labels:
        app: sensebox-fixture
    spec:
      automountServiceAccountToken: false
      containers:
        - name: sensebox
          image: hivebox:phase5-local
          imagePullPolicy: Never
          command: [python, /fixture/server.py]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          volumeMounts:
            - name: fixture
              mountPath: /fixture
              readOnly: true
      volumes:
        - name: fixture
          configMap:
            name: sensebox-fixture
---
apiVersion: v1
kind: Service
metadata:
  name: sensebox-fixture
spec:
  selector:
    app: sensebox-fixture
  ports:
    - port: 80
      targetPort: 8080
